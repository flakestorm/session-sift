name: Session Sift Gate

on:
  pull_request:
  push:

jobs:
  benchmark-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Enforce savings threshold
        run: |
          python scripts/check_savings_gate.py --iterations 1 --corpus-size 50 --min-avg-savings-pct 20.0

      - name: Upload benchmark docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-sift-gate-docs
          path: |
            docs/performance-baseline.md
            docs/oss-spec-tracker.md