<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f1f6ef"/>
  <rect x="80" y="80" width="1120" height="560" rx="28" fill="#1d3557"/>
  <text x="120" y="170" font-family="Georgia, serif" font-size="62" fill="#f1f6ef">Three-pass context control</text>
  <text x="120" y="280" font-family="Verdana, sans-serif" font-size="32" fill="#dce8f5">Pass 1: collapse trees, traces, JSON, diffs, and tool wrappers</text>
  <text x="120" y="340" font-family="Verdana, sans-serif" font-size="32" fill="#dce8f5">Pass 2: prune stale errors after later file writes</text>
  <text x="120" y="400" font-family="Verdana, sans-serif" font-size="32" fill="#dce8f5">Pass 3: compress low-signal chatter without losing paths or values</text>
  <text x="120" y="520" font-family="Verdana, sans-serif" font-size="28" fill="#9fc3e6">Benchmarked locally with fixture corpus and savings gate workflow</text>
</svg>